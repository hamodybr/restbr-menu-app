<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080604">

  <script>
    window.__smIntroBornAt=Date.now();
    try{
      localStorage.removeItem("SM_THEME_PREF_V1");
      document.documentElement.removeAttribute("data-sm-theme");
    }catch(_){}
  </script>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Menu">

  <title>Menu</title>
  <link rel="icon" href="assets/restbr-icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css?v=4.0">
  <link rel="stylesheet" href="css/cart.css?v=3.6">
  <link rel="stylesheet" href="css/responsive-parity.css?v=1.0">
  <link rel="stylesheet" href="css/phone-parity-v2.css?v=2.1">
</head>
<body>
  <video id="smBgVideo" class="sm-bg-video" autoplay muted loop playsinline></video>
  <div class="sm-bg-overlay"></div>
  <div id="smIntro" class="sm-intro"><div class="sm-intro-logo-wrap"><img src="" alt="" class="sm-intro-logo" style="visibility:hidden"></div><div class="sm-intro-brand"></div><div class="sm-intro-sub">MENU</div></div>
  <main id="smApp" class="sm-app">
    <header class="sm-header"><div class="sm-logo-wrap"><img src="" alt="" class="sm-logo" style="visibility:hidden"></div><h1>MENU</h1><p id="smSubtitle"></p><div id="smLangs" class="sm-langs"></div><div id="smActions" class="sm-actions"></div></header>
    <div class="sm-cats-wrap"><div id="smCats" class="sm-cats"></div><div id="smProgress" class="sm-progress"><span></span></div></div>
    <div id="smCatsSentinel"></div><section id="smMenu" class="sm-menu"></section>
    <footer class="sm-footer"><div class="sm-footer-card"><div class="sm-footer-line"></div><h2></h2><p class="sm-footer-location"></p><div class="sm-footer-main-actions"><a id="smFooterLocation" href="#" target="_blank">موقعنا</a><a id="smFooterCall" href="#">اتصال</a><a id="smFooterWhatsapp" href="#" target="_blank">WhatsApp Menu</a></div><div class="sm-footer-socials"><a id="smFacebook" href="#" target="_blank">Facebook</a><a id="smSnapchat" href="#" target="_blank">Snapchat</a><a id="smTikTok" href="#" target="_blank">TikTok</a><a id="smInstagram" href="#" target="_blank">Instagram</a></div><div class="sm-footer-phone"></div><div class="sm-footer-copy"></div></div></footer>
  </main>
  <button id="smTopBtn" class="sm-top-btn" type="button" aria-label="Back to top">↑</button>
  <script>
    (function(){try{const host=location.hostname.toLowerCase().replace(/^www\./,'');const raw=localStorage.getItem(`RESTBR_BRAND_CACHE_V2:${host}`);if(!raw)return;const cached=JSON.parse(raw)||{};const lang=localStorage.getItem("shorashLang")||"ar";const name=lang==="ku"?(cached.nameKu||cached.nameAr||cached.nameEn||""):lang==="en"?(cached.nameEn||cached.nameAr||cached.nameKu||""):(cached.nameAr||cached.nameKu||cached.nameEn||"");const brand=document.querySelector(".sm-intro-brand");if(brand)brand.textContent=name;document.querySelectorAll(".sm-intro-logo, .sm-logo").forEach(logo=>{if(logo&&cached.logo){logo.src=cached.logo;logo.style.visibility="visible";}});}catch(_){}})();
  </script>
  <script src="js/supabase-config.js?v=2.8"></script>
  <script src="js/tenant-head.js?v=1.0"></script>
  <script src="js/design-runtime.js?v=1.2"></script>
  <script src="js/app.js?v=17.4"></script>
  <script src="js/brand-cache-policy.js?v=2.0"></script>
  <script src="js/brand-template-fix.js?v=1.0"></script>
  <script src="js/currency-policy.js?v=1.0"></script>
  <script src="js/timezone-policy.js?v=1.0"></script>
  <script src="js/offline-policy.js?v=1.0"></script>
  <script src="js/language-policy.js?v=1.0"></script>
  <script src="js/menu-policy.js?v=1.0"></script>
  <script src="js/cart-preload.js?v=1.2"></script>
  <script src="js/order-analytics.js?v=1.0"></script>
</body>
</html>
