<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>QR • RESTBR</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#080706;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:20px}.card{width:min(390px,100%);border:1px solid rgba(216,169,88,.4);border-radius:24px;padding:20px;text-align:center;background:#11100e}.qr{width:280px;max-width:100%;aspect-ratio:1;background:#fff;border-radius:18px;padding:14px;margin:16px auto}.qr img{width:100%;height:100%;object-fit:contain}.btn{width:100%;height:48px;border:0;border-radius:14px;margin-top:8px;font-weight:900}.gold{background:#d8a958;color:#160f07}.dark{background:#1c1915;color:#fff;border:1px solid rgba(255,255,255,.12)}</style></head><body><div class="card"><h1 id="name">RESTBR</h1><p>QR Code</p><div class="qr"><img id="qr" alt="QR"></div><button id="share" class="btn gold">مشاركة / حفظ</button><button class="btn dark" onclick="location.href='index.html'">العودة للمنيو</button></div><script>(async()=>{const c=await fetch('data/restaurant.json',{cache:'no-store'}).then(r=>r.json());const name=c.name?.ar||c.name?.en||'Restaurant';document.getElementById('name').textContent=name;const url=location.href.replace(/qr\.html(?:\?.*)?$/,'');const src='https://api.qrserver.com/v1/create-qr-code/?size=1024x1024&margin=20&data='+encodeURIComponent(url);const img=document.getElementById('qr');img.src=src;document.getElementById('share').onclick=async()=>{try{const blob=await fetch(src).then(r=>r.blob());const file=new File([blob],(c.slug||'restaurant')+'-qr.png',{type:'image/png'});if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:name});else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}}catch(e){window.open(src,'_blank');}};})()</script></body></html>
