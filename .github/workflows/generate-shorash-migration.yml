name: Generate SHORASH Platform Migration SQL

on:
  push:
    branches: [ main ]
    paths:
      - 'migration/shorash/**'
      - '.github/workflows/generate-shorash-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SQL from exported SHORASH snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          RID = 'd47a8797-caf9-4bfd-a3cf-4bd55bda8ddb'
          base = Path('migration/shorash')
          settings = json.loads((base/'restaurant_settings.json').read_text(encoding='utf-8'))[0]
          categories = json.loads((base/'categories.json').read_text(encoding='utf-8'))
          products = json.loads((base/'products.json').read_text(encoding='utf-8'))
          options = json.loads((base/'product_options.json').read_text(encoding='utf-8'))

          def q(v):
              if v is None:
                  return 'null'
              return "'" + str(v).replace("'", "''") + "'"

          def qb(v):
              return 'true' if bool(v) else 'false'

          def qnum(v):
              return '0' if v is None else str(v)

          def qjson(v):
              return q(json.dumps(v, ensure_ascii=False, separators=(',', ':'))) + '::jsonb'

          def qtime(v):
              return 'null' if not v else q(v) + '::time'

          lines = []
          lines += [
              '-- RESTBR: migrate current SHORASH data into restbr-platform',
              '-- Generated automatically from the live public SHORASH Supabase snapshot.',
              'begin;',
              '',
              f"delete from public.product_options where restaurant_id = '{RID}';",
              f"delete from public.products where restaurant_id = '{RID}';",
              f"delete from public.categories where restaurant_id = '{RID}';",
              '',
              'update public.restaurant_settings',
              'set',
              f"  restaurant_name_ar = {q(settings.get('restaurant_name_ar'))},",
              f"  restaurant_name_ku = {q(settings.get('restaurant_name_ku'))},",
              f"  restaurant_name_en = {q(settings.get('restaurant_name_en'))},",
              f"  subtitle_ar = {q(settings.get('subtitle_ar'))},",
              f"  subtitle_ku = {q(settings.get('subtitle_ku'))},",
              f"  subtitle_en = {q(settings.get('subtitle_en'))},",
              f"  phone = {q(settings.get('phone'))},",
              f"  whatsapp = {q(settings.get('whatsapp_number') or settings.get('whatsapp'))},",
              f"  address_ar = {q(settings.get('address_ar'))},",
              f"  address_ku = {q(settings.get('address_ku'))},",
              f"  address_en = {q(settings.get('address_en'))},",
              f"  logo_url = {q(settings.get('logo_url'))},",
              f"  background_url = {q(settings.get('background_video_url') or settings.get('background_video'))},",
              f"  announcement_enabled = {qb(settings.get('announcement_enabled'))},",
              f"  announcement_ar = {q(settings.get('announcement_ar'))},",
              f"  announcement_ku = {q(settings.get('announcement_ku'))},",
              f"  announcement_en = {q(settings.get('announcement_en'))},",
              "  languages = array['ar','ku','en']::text[],",
              f"  branding = {qjson(settings)},",
              f"  ui_design_settings = {qjson(settings.get('ui_design_settings') or {})},",
              f"  social_links = {qjson(settings.get('custom_social_links') or [])},",
              f"  top_actions = {qjson(settings.get('custom_top_actions') or [])},",
              f"  footer_actions = {qjson(settings.get('custom_footer_actions') or [])},",
              "  updated_at = now()",
              f"where restaurant_id = '{RID}';",
              '',
              'update public.restaurants',
              f"set logo_url = {q(settings.get('logo_url'))}, updated_at = now()",
              f"where id = '{RID}';",
              '',
          ]

          for c in categories:
              meta = {}
              if c.get('image_url'):
                  meta['image_url'] = c.get('image_url')
              lines.append(
                  'insert into public.categories '
                  '(id,restaurant_id,slug,name_ar,name_ku,name_en,sort_order,is_active,is_visible,'
                  'availability_schedule_enabled,available_from,available_to,metadata) values ('
                  f"{q(c['id'])},{q(RID)},{q(c.get('slug'))},{q(c.get('name_ar'))},{q(c.get('name_ku'))},{q(c.get('name_en'))},"
                  f"{qnum(c.get('sort_order'))},{qb(c.get('is_active', True))},{qb(c.get('is_visible', True))},"
                  f"{qb(c.get('availability_schedule_enabled', False))},{qtime(c.get('available_from'))},{qtime(c.get('available_to'))},{qjson(meta)}"
                  ') on conflict (id) do update set '
                  'restaurant_id=excluded.restaurant_id,slug=excluded.slug,name_ar=excluded.name_ar,name_ku=excluded.name_ku,'
                  'name_en=excluded.name_en,sort_order=excluded.sort_order,is_active=excluded.is_active,is_visible=excluded.is_visible,'
                  'availability_schedule_enabled=excluded.availability_schedule_enabled,available_from=excluded.available_from,'
                  'available_to=excluded.available_to,metadata=excluded.metadata,updated_at=now();'
              )

          lines.append('')

          for p in products:
              meta = {
                  'legacy_is_active': p.get('is_active', True),
                  'has_options': p.get('has_options', False),
              }
              lines.append(
                  'insert into public.products '
                  '(id,restaurant_id,category_id,name_ar,name_ku,name_en,description_ar,description_ku,description_en,image_url,'
                  'base_price,sort_order,is_available,is_visible,availability_schedule_enabled,available_from,available_to,metadata) values ('
                  f"{q(p['id'])},{q(RID)},{q(p['category_id'])},{q(p.get('name_ar'))},{q(p.get('name_ku'))},{q(p.get('name_en'))},"
                  f"{q(p.get('description_ar'))},{q(p.get('description_ku'))},{q(p.get('description_en'))},{q(p.get('image_url'))},"
                  f"{qnum(p.get('base_price'))},{qnum(p.get('sort_order'))},{qb(p.get('is_available', True))},{qb(p.get('is_visible', True))},"
                  f"{qb(p.get('availability_schedule_enabled', False))},{qtime(p.get('available_from'))},{qtime(p.get('available_to'))},{qjson(meta)}"
                  ') on conflict (id) do update set '
                  'restaurant_id=excluded.restaurant_id,category_id=excluded.category_id,name_ar=excluded.name_ar,name_ku=excluded.name_ku,'
                  'name_en=excluded.name_en,description_ar=excluded.description_ar,description_ku=excluded.description_ku,'
                  'description_en=excluded.description_en,image_url=excluded.image_url,base_price=excluded.base_price,'
                  'sort_order=excluded.sort_order,is_available=excluded.is_available,is_visible=excluded.is_visible,'
                  'availability_schedule_enabled=excluded.availability_schedule_enabled,available_from=excluded.available_from,'
                  'available_to=excluded.available_to,metadata=excluded.metadata,updated_at=now();'
              )

          lines.append('')

          for o in options:
              meta = {'is_available': o.get('is_available', True)}
              lines.append(
                  'insert into public.product_options '
                  '(id,restaurant_id,product_id,name_ar,name_ku,name_en,price,sort_order,is_active,metadata) values ('
                  f"{q(o['id'])},{q(RID)},{q(o['product_id'])},{q(o.get('name_ar'))},{q(o.get('name_ku'))},{q(o.get('name_en'))},"
                  f"{qnum(o.get('price'))},{qnum(o.get('sort_order'))},{qb(o.get('is_active', True))},{qjson(meta)}"
                  ') on conflict (id) do update set '
                  'restaurant_id=excluded.restaurant_id,product_id=excluded.product_id,name_ar=excluded.name_ar,name_ku=excluded.name_ku,'
                  'name_en=excluded.name_en,price=excluded.price,sort_order=excluded.sort_order,is_active=excluded.is_active,'
                  'metadata=excluded.metadata,updated_at=now();'
              )

          lines += [
              '',
              'commit;',
              '',
              '-- Verification:',
              f"select 'categories' as table_name, count(*) from public.categories where restaurant_id='{RID}'",
              'union all',
              f"select 'products', count(*) from public.products where restaurant_id='{RID}'",
              'union all',
              f"select 'options', count(*) from public.product_options where restaurant_id='{RID}';",
              ''
          ]

          out = base/'MIGRATE_TO_RESTBR_PLATFORM.sql'
          out.write_text('\n'.join(lines), encoding='utf-8')
          print(f'Generated {out} with {len(categories)} categories, {len(products)} products, {len(options)} options')
          PY

      - name: Commit generated migration SQL
        run: |
          git config user.name "restbr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add migration/shorash/MIGRATE_TO_RESTBR_PLATFORM.sql
          if git diff --cached --quiet; then
            echo "No migration SQL changes"
            exit 0
          fi
          git commit -m "Generate SHORASH restbr-platform migration SQL"
          git push
