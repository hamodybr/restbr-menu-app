name: Validate RESTBR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)

      - name: Validate JSON assets
        shell: bash
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/menu.json','utf8')); console.log('data/menu.json OK')"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest.webmanifest OK')"

      - name: Required runtime files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            css/responsive-parity.css
            js/supabase-config.js
            js/tenant-head.js
            js/brand-template-fix.js
            js/currency-policy.js
            js/timezone-policy.js
            js/offline-policy.js
            js/language-policy.js
            js/menu-policy.js
            js/cart-preload.js
            js/cart.js
            js/order-analytics.js
            owner/auth-v2.js
            owner/tenant-recovery-v2.js
            owner/permissions-v2.js
            owner/owner-v2.js
            owner/owner-settings-v2.js
            owner/bulk-pricing-v2.js
            owner/analytics-v2.js
            owner/visibility-v2.js
            owner/audit-v2.js
            owner/qr-v2.js
            admin/session-v2.js
            admin/admin-v2.js
            admin/plan-v2.js
            admin/restaurant-settings-v2.js
            admin/domains-v2.js
            migration/platform/RESTBR-PRODUCT-OPTIONS-SYNC-V1.sql
            migration/platform/RESTBR-MEMBERS-V1.sql
            migration/platform/RESTBR-ANALYTICS-V2.sql
            migration/platform/RESTBR-SECURITY-HARDEN-V1.sql
            migration/platform/RESTBR-AUDIT-V1.sql
          )
          for file in "${required[@]}"; do
            echo "Required: $file"
            test -f "$file"
          done

      - name: Guard RESTBR runtime versions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'responsive-parity.css?v=1.0' index.html
          grep -q 'supabase-config.js?v=2.8' index.html
          grep -q 'brand-template-fix.js?v=1.0' index.html
          grep -q 'currency-policy.js?v=1.0' index.html
          grep -q 'timezone-policy.js?v=1.0' index.html
          grep -q 'cart-preload.js?v=1.2' index.html
          grep -q 'order-analytics.js?v=1.0' index.html
          grep -q 'restbr-menu-core-v17' sw.js
          grep -q 'responsive-parity.css?v=1.0' sw.js
          grep -q 'brand-template-fix.js?v=1.0' sw.js
          grep -q 'currency-policy.js?v=1.0' sw.js
          grep -q 'cart-preload.js?v=1.2' sw.js
          grep -q 'cart.js?v=4.2' sw.js
          grep -q 'supabase-config.js?v=2.8' sw.js
          grep -q 'config.js?v=1.1' owner/index.html
          grep -q 'tenant-recovery-v2.js?v=2.1' owner/config.js
          grep -q 'permissions-v2.js?v=2.1' owner/config.js
          grep -q 'visibility-v2.js?v=2.1' owner/config.js
          grep -q 'audit-v2.js?v=2.1' owner/config.js
          grep -q 'qr-v2.js?v=2.1' owner/config.js
          grep -q 'session-v2.js?v=2.1' admin/index.html
          grep -q 'admin-v2.js?v=2.1' admin/index.html
          grep -q 'plan-v2.js?v=2.2' admin/index.html
          grep -q 'restaurant-settings-v2.js?v=2.0' admin/index.html
          grep -q 'domains-v2.js?v=2.0' admin/index.html

      - name: Guard tenant cart isolation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'restbrCartV2:' js/cart-preload.js
          grep -q 'restbrCartV2:' js/cart.js
          grep -q 'optionId' js/cart.js

      - name: Guard management hidden semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -q '\[hidden\]{display:none!important}' owner/config.js
          grep -q '\[hidden\]{display:none!important}' admin/session-v2.js

      - name: Guard migration transaction ownership
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            migration/platform/RESTBR-PRODUCT-OPTIONS-SYNC-V1.sql \
            migration/platform/RESTBR-MEMBERS-V1.sql \
            migration/platform/RESTBR-ANALYTICS-V2.sql \
            migration/platform/RESTBR-SECURITY-HARDEN-V1.sql \
            migration/platform/RESTBR-AUDIT-V1.sql; do
            if grep -Eiq '^[[:space:]]*(begin|commit);[[:space:]]*$' "$file"; then
              echo "Nested transaction found in $file" >&2
              exit 1
            fi
          done
