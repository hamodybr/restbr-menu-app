name: Validate RESTBR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)

      - name: Validate JSON assets
        shell: bash
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/menu.json','utf8')); console.log('data/menu.json OK')"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest.webmanifest OK')"

      - name: Required runtime files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            js/supabase-config.js
            js/tenant-head.js
            js/timezone-policy.js
            js/offline-policy.js
            js/language-policy.js
            js/menu-policy.js
            js/cart-preload.js
            js/order-analytics.js
            owner/auth-v2.js
            owner/permissions-v2.js
            owner/owner-v2.js
            owner/owner-settings-v2.js
            owner/bulk-pricing-v2.js
            owner/analytics-v2.js
            admin/admin-v2.js
            admin/plan-v2.js
            migration/platform/RESTBR-PRODUCT-OPTIONS-SYNC-V1.sql
            migration/platform/RESTBR-MEMBERS-V1.sql
            migration/platform/RESTBR-ANALYTICS-V2.sql
            migration/platform/RESTBR-SECURITY-HARDEN-V1.sql
          )
          for file in "${required[@]}"; do
            echo "Required: $file"
            test -f "$file"
          done

      - name: Guard RESTBR runtime versions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'supabase-config.js?v=2.8' index.html
          grep -q 'cart-preload.js?v=1.1' index.html
          grep -q 'order-analytics.js?v=1.0' index.html
          grep -q 'restbr-menu-core-v14' sw.js
          grep -q 'supabase-config.js?v=2.8' sw.js
