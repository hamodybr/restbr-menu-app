name: Export Current SHORASH Supabase Data

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export current SHORASH public data
        env:
          OLD_SUPABASE_URL: https://pklzxpivnoqnrzyjryqz.supabase.co
          OLD_SUPABASE_KEY: sb_publishable_CC5l_DeuRDVy32hFOoVWMw_7i45WhmK
        run: |
          set -euo pipefail
          mkdir -p migration/shorash

          curl -fsS "$OLD_SUPABASE_URL/rest/v1/restaurant_settings?select=*&order=updated_at.desc&limit=1" \
            -H "apikey: $OLD_SUPABASE_KEY" -H "Accept: application/json" \
            | jq '.' > migration/shorash/restaurant_settings.json

          curl -fsS "$OLD_SUPABASE_URL/rest/v1/categories?select=*&order=sort_order.asc" \
            -H "apikey: $OLD_SUPABASE_KEY" -H "Accept: application/json" \
            | jq '.' > migration/shorash/categories.json

          curl -fsS "$OLD_SUPABASE_URL/rest/v1/products?select=*&order=sort_order.asc" \
            -H "apikey: $OLD_SUPABASE_KEY" -H "Accept: application/json" \
            | jq '.' > migration/shorash/products.json

          curl -fsS "$OLD_SUPABASE_URL/rest/v1/product_options?select=*&order=sort_order.asc" \
            -H "apikey: $OLD_SUPABASE_KEY" -H "Accept: application/json" \
            | jq '.' > migration/shorash/product_options.json

          printf 'settings=%s\ncategories=%s\nproducts=%s\noptions=%s\n' \
            "$(jq 'length' migration/shorash/restaurant_settings.json)" \
            "$(jq 'length' migration/shorash/categories.json)" \
            "$(jq 'length' migration/shorash/products.json)" \
            "$(jq 'length' migration/shorash/product_options.json)" \
            > migration/shorash/counts.txt

      - name: Commit export snapshot
        run: |
          git config user.name "restbr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add migration/shorash
          if git diff --cached --quiet; then
            echo "No export changes"
            exit 0
          fi
          git commit -m "Export current SHORASH menu data"
          git push
