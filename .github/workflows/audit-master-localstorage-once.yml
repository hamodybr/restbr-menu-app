name: Audit master localStorage once

on:
  push:
    branches:
      - template/single-restaurant
    paths:
      - .github/workflows/audit-master-localstorage-once.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: template/single-restaurant
      - name: Find Shorash localStorage keys
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          exts = {'.js', '.html', '.css', '.json', '.md'}
          direct = re.compile(r"localStorage\.(?:getItem|setItem|removeItem)\(\s*(['\"])(.*?)\1", re.S)
          const_re = re.compile(r"\b(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*(['\"])(.*?)\2")
          call_id = re.compile(r"localStorage\.(?:getItem|setItem|removeItem)\(\s*([A-Za-z_$][\w$]*)\b", re.S)

          found = []
          for path in sorted(Path('.').rglob('*')):
              if not path.is_file() or path.suffix.lower() not in exts or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue

              for m in direct.finditer(text):
                  key = m.group(2)
                  if 'shorash' in key.lower():
                      found.append((str(path), key, 'direct'))

              consts = {m.group(1): m.group(3) for m in const_re.finditer(text)}
              for m in call_id.finditer(text):
                  name = m.group(1)
                  key = consts.get(name, '')
                  if 'shorash' in key.lower():
                      found.append((str(path), key, f'via {name}'))

          unique = sorted(set(found))
          print('RESTBR_LOCALSTORAGE_AUDIT_BEGIN')
          for row in unique:
              print('\t'.join(row))
          print('RESTBR_LOCALSTORAGE_AUDIT_END')
          print('COUNT', len(unique))
          PY
