name: Harden rls_auto_enable once

on:
  push:
    branches:
      - template/single-restaurant
    paths:
      - .github/workflows/harden-rls-auto-enable-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: template/single-restaurant
          fetch-depth: 0

      - name: Add defensive bootstrap guard and migration
        run: |
          python - <<'PY'
          from pathlib import Path

          bootstrap = Path('supabase/bootstrap.sql')
          text = bootstrap.read_text(encoding='utf-8')

          if 'rls_auto_enable()' in text:
              raise SystemExit('Unexpected rls_auto_enable reference already exists in bootstrap')

          marker = '\ncommit;\n'
          if text.count(marker) != 1:
              raise SystemExit(f'Expected exactly one final commit marker, found {text.count(marker)}')

          guard = '\n'.join([
              '-- Defensive compatibility hardening: older RESTBR databases may contain this',
              '-- SECURITY DEFINER helper. Fresh databases do not create it, but if it exists',
              '-- it must never be executable by public browser roles.',
              'do $$',
              'begin',
              "  if to_regprocedure('public.rls_auto_enable()') is not null then",
              "    execute 'revoke execute on function public.rls_auto_enable() from public, anon, authenticated';",
              '  end if;',
              'end;',
              '$$;',
              '',
          ])
          bootstrap.write_text(text.replace(marker, '\n' + guard + marker), encoding='utf-8')

          migration = Path('supabase/migrations/202609010630_revoke_rls_auto_enable_public.sql')
          if migration.exists():
              raise SystemExit('Migration already exists')
          migration_text = '\n'.join([
              '-- RESTBR security hardening for databases created from older revisions.',
              '-- No-op when public.rls_auto_enable() does not exist.',
              '',
              'do $$',
              'begin',
              "  if to_regprocedure('public.rls_auto_enable()') is not null then",
              "    execute 'revoke execute on function public.rls_auto_enable() from public, anon, authenticated';",
              '  end if;',
              'end;',
              '$$;',
              '',
          ])
          migration.write_text(migration_text, encoding='utf-8')
          PY

      - name: Verify narrow safe change
        run: |
          changed=$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort )
          printf '%s\n' "$changed"
          expected=$(printf '%s\n' \
            'supabase/bootstrap.sql' \
            'supabase/migrations/202609010630_revoke_rls_auto_enable_public.sql' | sort)
          test "$changed" = "$expected"

          grep -Fq "to_regprocedure('public.rls_auto_enable()')" supabase/bootstrap.sql
          grep -Fq "revoke execute on function public.rls_auto_enable() from public, anon, authenticated" supabase/bootstrap.sql
          grep -Fq "revoke execute on function public.rls_auto_enable() from public, anon, authenticated" supabase/migrations/202609010630_revoke_rls_auto_enable_public.sql

          # Do not alter the intentionally public analytics RPC.
          grep -Fq 'grant execute on function public.track_menu_event' supabase/bootstrap.sql

          git diff --check

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/bootstrap.sql supabase/migrations/202609010630_revoke_rls_auto_enable_public.sql
          git commit -m "security: guard legacy rls_auto_enable execute access"
          git push origin HEAD:template/single-restaurant
