name: Validate RESTBR 5A Onboarding

on:
  push:
    branches: [tmp-5a-multitenant-recovery]
  pull_request:
    branches: [tmp-5a-multitenant-recovery]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check onboarding JavaScript syntax
        run: |
          node --check admin/onboarding-preflight-v1.js
          node --check admin/admin-v6-policy.js

      - name: Guard staged onboarding runtime
        run: |
          set -euo pipefail
          file=admin/onboarding-preflight-v1.js
          test -f "$file"
          grep -q "admin_create_restaurant_preview" "$file"
          grep -q "admin_provision_restaurant" "$file"
          grep -q "admin_restaurant_provision_status" "$file"
          grep -q "admin_activate_restaurant" "$file"
          grep -q "form.addEventListener('submit', runOnboarding, true)" "$file"
          grep -q "handleDraftActivation" "$file"
          grep -q "window.confirm" "$file"
          ! grep -q "form.requestSubmit()" "$file"
          ! grep -q "rpc('admin_create_restaurant'" "$file"
          grep -q "onboarding-preflight-v1.js?v=1.2" admin/admin-v6-policy.js

      - name: Guard preflight migration
        run: |
          set -euo pipefail
          file=migration/platform/RESTBR-ONBOARDING-PREFLIGHT-V1.sql
          test -f "$file"
          grep -q "security definer" "$file"
          grep -q "private.is_platform_admin()" "$file"
          grep -q "dry_run" "$file"
          grep -q "slug_already_exists" "$file"
          grep -q "hostname_already_exists" "$file"
          grep -q "grant execute.*authenticated" "$file"
          ! grep -Eiq "^[[:space:]]*(insert|update|delete|truncate)[[:space:]]" "$file"

      - name: Guard staged provisioning migration
        run: |
          set -euo pipefail
          file=migration/platform/RESTBR-ONBOARDING-STAGED-V1.sql
          test -f "$file"
          grep -q "admin_provision_restaurant" "$file"
          grep -q "admin_restaurant_provision_status" "$file"
          grep -q "admin_activate_restaurant" "$file"
          grep -q "'draft'" "$file"
          grep -q "'pending'" "$file"
          grep -q "domain must be pending before activation" "$file"
          grep -q "private.is_platform_admin()" "$file"
          grep -q "grant execute.*authenticated" "$file"

      - name: Guard server-side activation gate
        run: |
          set -euo pipefail
          file=migration/platform/RESTBR-ONBOARDING-ACTIVATION-GUARD-V1.sql
          test -f "$file"
          grep -q "guard_restaurant_activation" "$file"
          grep -q "old.status = 'draft'" "$file"
          grep -q "new.status = 'active'" "$file"
          grep -q "restbr.activation_authorized" "$file"
          grep -q "draft restaurant activation requires admin_activate_restaurant" "$file"
          grep -q "set_config('restbr.activation_authorized','1',true)" "$file"

      - name: Guard tenant deletion audit history
        run: |
          set -euo pipefail
          file=migration/platform/RESTBR-AUDIT-TENANT-DELETE-V1.sql
          test -f "$file"
          grep -q "tenant_id_snapshot" "$file"
          grep -q "on delete set null" "$file"
          grep -q "audit_logs_tenant_id_snapshot_idx" "$file"
          grep -q "v_live_restaurant_id" "$file"
          grep -q "private.log_restbr_audit_change" "$file"
