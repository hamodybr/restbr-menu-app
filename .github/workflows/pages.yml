name: Validate and Deploy RESTBR Master Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pre-deploy audit
        run: node scripts/predeploy-check.mjs

      - name: Product color regression check
        run: node scripts/product-colors-check.mjs

      - name: Order persistence regression check
        run: node scripts/order-persistence-check.mjs

      - name: Admin orders regression check
        run: node scripts/admin-orders-check.mjs

      - name: Invoice print regression check
        run: node scripts/invoice-print-check.mjs

      - name: Master readiness check
        run: node scripts/master-readiness-check.mjs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  live-smoke:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify deployed RESTBR master site
        env:
          SMOKE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/live-smoke-test.mjs
