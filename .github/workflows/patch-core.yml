name: Patch RestBR Shared Core

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove SHORASH-only fallbacks from shared core
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('js/app.js')
          text = app.read_text(encoding='utf-8')
          text = text.replace(
              'settings.whatsapp_url ||\n      "9647502662002"',
              'settings.whatsapp_url ||\n      ""'
          )
          text = text.replace('"assets/shorash-logo.jpeg"', '""')
          app.write_text(text, encoding='utf-8')

          cart = Path('js/cart.js')
          text = cart.read_text(encoding='utf-8')
          text = text.replace('const KEY="shorashCartV1";', 'const KEY="restbrCartV1";')
          text = text.replace('r.whatsappNumber||r.whatsapp||"9647502662002"', 'r.whatsappNumber||r.whatsapp||""')
          text = text.replace('return digits||"9647502662002";', 'return digits||"";')
          old = 'const url=\n      `https://wa.me/${whatsappNumber()}?text=${encodeURIComponent(lines.join("\\\n"))}`;'
          new = 'const number=whatsappNumber();\n    if(!number){toast(tr("required"));return}\n\n    const url=\n      `https://wa.me/${number}?text=${encodeURIComponent(lines.join("\\\n"))}`;'
          text = text.replace(old, new)
          cart.write_text(text, encoding='utf-8')
          PY

      - name: Commit tenant-safety patch
        run: |
          git config user.name "restbr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/app.js js/cart.js
          if git diff --cached --quiet; then
            echo "Nothing to patch"
            exit 0
          fi
          git commit -m "Harden shared menu core for multiple restaurants"
          git push
