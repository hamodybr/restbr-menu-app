name: Bootstrap RestBR Menu Core

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout SHORASH V2 source
        uses: actions/checkout@v4
        with:
          repository: hamodybr/shorash-menu-v2
          ref: main
          path: source

      - name: Copy SHORASH V2 into RestBR core
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows/bootstrap.yml' \
            source/ target/
          mkdir -p target/.github/workflows
          cp "$GITHUB_WORKSPACE/target/.github/workflows/bootstrap.yml" "$GITHUB_WORKSPACE/bootstrap.keep.yml" 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/bootstrap.keep.yml" "$GITHUB_WORKSPACE/target/.github/workflows/bootstrap.yml" 2>/dev/null || true

      - name: Commit copied source
        working-directory: target
        run: |
          git config user.name "restbr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Bootstrap RestBR menu core from SHORASH V2"
          git push
