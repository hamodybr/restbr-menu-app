<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>RESTBR Owner Account</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:18px;background:#090807;color:#f8f4ed;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.card{width:min(430px,100%);border:1px solid rgba(216,169,88,.28);border-radius:24px;background:#11100e;padding:20px;box-shadow:0 25px 80px rgba(0,0,0,.45)}h1{margin:0 0 5px;font-size:24px}p{color:#9b9389;font-size:12px;line-height:1.7}.tenant{color:#d8a958;font-weight:900;margin-bottom:14px}label{display:block;color:#9b9389;font-size:11px;margin-top:10px}input{width:100%;margin-top:5px;border:1px solid rgba(255,255,255,.12);background:#0b0a09;color:#fff;border-radius:12px;padding:12px;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}button{min-height:46px;border-radius:12px;border:1px solid rgba(216,169,88,.3);background:rgba(216,169,88,.08);color:#d8a958;font-weight:900}button.primary{background:linear-gradient(135deg,#d8a958,#b77a2b);color:#150e05;border:0}.msg{min-height:40px;margin-top:12px;font-size:12px;line-height:1.6;color:#9b9389}.msg.ok{color:#4ade80}.msg.err{color:#ef6b6b}.back{display:block;text-align:center;margin-top:12px;color:#d8a958;text-decoration:none;font-size:12px}@media(max-width:480px){.row{grid-template-columns:1fr}}</style></head><body><main class="card"><h1>RESTBR Owner</h1><p>إنشاء حساب صاحب المطعم أو إعادة إرسال رابط تأكيد البريد.</p><div id="tenant" class="tenant"></div><label>البريد الإلكتروني<input id="email" type="email" autocomplete="email" dir="ltr"></label><label>كلمة المرور<input id="password" type="password" autocomplete="new-password" minlength="8"></label><div class="row"><button id="resend" type="button">إعادة إرسال التأكيد</button><button id="signup" class="primary" type="button">إنشاء الحساب</button></div><div id="msg" class="msg"></div><a id="back" class="back" href="#">الرجوع إلى Owner</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{'use strict';const SUPABASE_URL='https://xdqewaapwhmqlfotaofg.supabase.co',KEY='sb_publishable_dOGkocLtn1WVvrxmu6TnJQ_8qyPyV-T';const q=new URLSearchParams(location.search),slug=String(q.get('tenant')||'').trim().toLowerCase();const $=id=>document.getElementById(id);$('tenant').textContent=slug?`${slug}.restbr.com`:'حدد المطعم عبر ?tenant=slug';const ownerUrl=()=>{const host=slug?`${slug}.restbr.com`:location.hostname;const u=new URL(`https://${host}/owner/`);if(slug)u.searchParams.set('tenant',slug);return u.toString()};$('back').href=ownerUrl();const redirectUrl=()=>{const u=new URL(ownerUrl());u.searchParams.set('auth','confirmed');return u.toString()};const sb=supabase.createClient(SUPABASE_URL,KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const msg=(t,k='')=>{$('msg').textContent=t;$('msg').className='msg'+(k?' '+k:'')};$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!slug)return msg('Tenant slug مفقود.','err');if(!email)return msg('اكتب البريد الإلكتروني.','err');if(password.length<8)return msg('كلمة المرور يجب أن تكون 8 أحرف على الأقل.','err');$('signup').disabled=true;msg('جاري إنشاء الحساب...');try{const {error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:redirectUrl()}});if(error)throw error;msg('تم إنشاء الحساب ✓ افتح أحدث رسالة تأكيد.','ok')}catch(e){msg(e.message||String(e),'err')}finally{$('signup').disabled=false}};$('resend').onclick=async()=>{const email=$('email').value.trim();if(!slug)return msg('Tenant slug مفقود.','err');if(!email)return msg('اكتب البريد الإلكتروني أولًا.','err');$('resend').disabled=true;msg('جاري إرسال رابط جديد...');try{const {error}=await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:redirectUrl()}});if(error)throw error;msg('تم إرسال رابط جديد ✓ استخدم أحدث رسالة فقط.','ok')}catch(e){msg(e.message||String(e),'err')}finally{$('resend').disabled=false}}})();</script></body></html>
